# Manual npm publish workflow.
#
# Trigger: Actions → Release → Run workflow (workflow_dispatch).
# Auth: npm Trusted Publishing (OIDC). The package on npmjs.com has this
# repository + release.yml registered as a trusted publisher, so no
# NPM_TOKEN secret is needed. Requires npm >= 11.5.1 (bundled with Node 24).

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:coverage

      - run: npm publish --access public
