name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Lint
        run: |
          npm run lint -- --format json > /tmp/lint.json 2>&1 || true
          npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: |
          npm test -- \
            --reporter=verbose \
            --reporter=json \
            "--outputFile.json=/tmp/vitest.json"

      - name: Coverage
        run: npm run test:coverage

      - name: Job summary
        if: always()
        run: |
          cat > /tmp/unit-summary.cjs << 'ENDSCRIPT'
          const fs = require('fs');
          const out = process.env.GITHUB_STEP_SUMMARY;
          let md = '## Unit Job Summary\n\n';

          // ESLint
          try {
            const lint = JSON.parse(fs.readFileSync('/tmp/lint.json', 'utf8'));
            const errors = lint.reduce((s, f) => s + f.errorCount, 0);
            const warnings = lint.reduce((s, f) => s + f.warningCount, 0);
            const icon = errors === 0 ? '✅' : '❌';
            md += `### ${icon} ESLint\n\n`;
            md += `| Errors | Warnings |\n|--------|----------|\n| ${errors} | ${warnings} |\n\n`;
          } catch { md += '### ⚠️ ESLint — results unavailable\n\n'; }

          // Unit tests
          try {
            const v = JSON.parse(fs.readFileSync('/tmp/vitest.json', 'utf8'));
            const icon = v.numFailedTests === 0 ? '✅' : '❌';
            md += `### ${icon} Unit Tests\n\n`;
            md += `| Passed | Failed | Total | Suites |\n|--------|--------|-------|--------|\n`;
            md += `| ${v.numPassedTests} | ${v.numFailedTests} | ${v.numTotalTests} | ${v.numTotalTestSuites} |\n\n`;
          } catch { md += '### ⚠️ Unit Tests — results unavailable\n\n'; }

          // Coverage — parse coverage-final.json (Istanbul/V8 format)
          try {
            const cov = JSON.parse(fs.readFileSync('coverage/coverage-final.json', 'utf8'));
            let s = {t:0,c:0}, fn = {t:0,c:0}, b = {t:0,c:0};
            for (const file of Object.values(cov)) {
              for (const v of Object.values(file.s)) { s.t++; if (v > 0) s.c++; }
              for (const v of Object.values(file.f)) { fn.t++; if (v > 0) fn.c++; }
              for (const bs of Object.values(file.b)) for (const v of bs) { b.t++; if (v > 0) b.c++; }
            }
            const p = ({c, t}) => t > 0 ? (c / t * 100).toFixed(2) : '100.00';
            const ok = v => parseFloat(v) >= 80 ? '✅' : '❌';
            const sp = p(s), fp = p(fn), bp = p(b);
            md += '### Coverage _(threshold: 80%)_\n\n';
            md += '| Metric | % | Status |\n|--------|---|--------|\n';
            md += `| Statements | ${sp}% | ${ok(sp)} |\n`;
            md += `| Functions  | ${fp}% | ${ok(fp)} |\n`;
            md += `| Branches   | ${bp}% | ${ok(bp)} |\n\n`;
          } catch { md += '### ⚠️ Coverage — results unavailable\n\n'; }

          fs.appendFileSync(out, md);
          ENDSCRIPT
          node /tmp/unit-summary.cjs

  e2e:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Cache the Cypress binary to avoid re-downloading it on every run
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('ejemplo/package.json') }}
          restore-keys: cypress-${{ runner.os }}-

      # Build the library (ejemplo packages depend on dist/ via file:)
      - run: npm ci
      - run: npm run build

      # Install ejemplo workspace dependencies.
      # The lockfile was generated on Windows (only has @esbuild/win32-x64, not
      # @esbuild/linux-x64). Delete it so npm resolves fresh for Linux and
      # installs the correct platform optional deps (esbuild, parcel-watcher…).
      # CYPRESS_INSTALL_BINARY=0 suppresses the binary download (installed separately).
      - name: Install ejemplo dependencies
        run: |
          rm -f package-lock.json
          npm install
        working-directory: ejemplo
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Install Cypress binary
        run: npx cypress install
        working-directory: ejemplo

      # Verify vite is properly installed — fail explicitly if not
      - name: Verify vite
        run: |
          set -e
          echo "node: $(node --version), npm: $(npm --version)"
          ls node_modules/vite/bin/vite.js
          node node_modules/vite/bin/vite.js --version
        working-directory: ejemplo

      # Each MFE as its own step so failure is precisely identified
      - name: Build mfe-store
        run: cd packages/mfe-store && node ../../node_modules/vite/bin/vite.js build
        working-directory: ejemplo

      - name: Build mfe-forms
        run: cd packages/mfe-forms && node ../../node_modules/vite/bin/vite.js build
        working-directory: ejemplo

      - name: Build mfe-admin
        run: cd packages/mfe-admin && node ../../node_modules/vite/bin/vite.js build
        working-directory: ejemplo

      - name: Build shell
        run: cd packages/shell && node ../../node_modules/vite/bin/vite.js build
        working-directory: ejemplo

      # Start all 4 preview servers in background
      - name: Start preview servers
        run: |
          npm run preview -w packages/mfe-store &
          npm run preview -w packages/mfe-forms &
          npm run preview -w packages/mfe-admin &
          npm run preview -w packages/shell &
        working-directory: ejemplo

      # Wait until all 4 servers respond before running Cypress
      - name: Wait for servers to be ready
        run: |
          npx --yes wait-on \
            http://localhost:5000 \
            http://localhost:5001 \
            http://localhost:5002 \
            http://localhost:5003 \
            --timeout 30000
        working-directory: ejemplo

      # Run only the 5 extension spec files; tee output for the job summary
      - name: Run Cypress e2e tests
        run: |
          set -o pipefail
          npx cypress run --spec "cypress/e2e/extension/**/*.cy.ts" --headless \
            2>&1 | tee /tmp/cypress-output.txt
        working-directory: ejemplo

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: ejemplo/cypress/screenshots
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          cat > /tmp/e2e-summary.cjs << 'ENDSCRIPT'
          const fs = require('fs');
          const out = process.env.GITHUB_STEP_SUMMARY;
          let md = '## E2E Job Summary\n\n';

          try {
            const text = fs.readFileSync('/tmp/cypress-output.txt', 'utf8');
            const passingMatch = text.match(/(\d+) passing/);
            const failingMatch = text.match(/(\d+) failing/);
            const passing = passingMatch ? parseInt(passingMatch[1]) : 0;
            const failing = failingMatch ? parseInt(failingMatch[1]) : 0;
            const total = passing + failing;
            const icon = failing === 0 && total > 0 ? '✅' : '❌';
            md += `### ${icon} E2E Tests (Cypress)\n\n`;
            md += `| Passed | Failed | Total |\n|--------|--------|-------|\n`;
            md += `| ${passing} | ${failing} | ${total} |\n\n`;
          } catch { md += '### ⚠️ E2E Tests — results unavailable\n\n'; }

          fs.appendFileSync(out, md);
          ENDSCRIPT
          node /tmp/e2e-summary.cjs
